services:
  - type: web
    name: moneymb-backend
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:backend
    startCommand: node packages/backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
